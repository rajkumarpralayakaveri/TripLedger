spring:
  application:
    name: tripledger-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/tripledger
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}